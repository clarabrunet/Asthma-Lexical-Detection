[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asthma-lexical-detection"
version = "1.0.0"
description = "Strategy 1 (E1): lexical rule-based asthma detection in Spanish clinical notes (TF-IDF + Aho-Corasick + NegEx)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clara Brunet" }]
keywords = ["nlp", "clinical-nlp", "ehr", "asthma", "negex", "tf-idf", "rule-based"]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "spacy>=3.0",
    "pyahocorasick>=1.4",
    "nltk>=3.7",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
